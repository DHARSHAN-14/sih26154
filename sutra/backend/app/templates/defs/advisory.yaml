id: advisory
version: 1
renderer: docx
content_contract:
  sections:
    - key: title
      required: true
      max_chars: 120
      prefers_fact_types: [event, attribute]
    - key: severity
      required: true
      enum: [Critical, High, Medium, Low, Informational]
      on_missing: flag_gap
    - key: affected_systems
      required: true
      min_facts: 1
      on_missing: flag_gap
    - key: technical_details
      required: false
      min_facts: 2
    - key: recommended_actions
      required: true
      min_facts: 1
      on_missing: flag_gap
    - key: references
      required: true
layout_contract:
  renderer: docx
  max_pages: 2
  font_family: "Noto Sans"
  body_pt: 10.5
  heading_pt: 14
  checks: [page_count, empty_section, orphan_heading, table_overflow]
parameter_bindings:
  detail_level:
    low:
      include: [title, severity, affected_systems, recommended_actions]
      max_claims_per_section: 2
    medium:
      include: [title, severity, affected_systems, technical_details, recommended_actions]
      max_claims_per_section: 4
    high:
      include: "*"
      max_claims_per_section: 8
  audience:
    executive:
      tone: neutral-formal
      jargon: strip
      prefers_fact_types: [metric, event]
      sensitivity_max: internal
    technical:
      tone: precise
      jargon: keep
      prefers_fact_types: [attribute, relation]
      sensitivity_max: restricted
    public:
      tone: plain
      jargon: strip
      sensitivity_max: public
    field:
      tone: plain
      jargon: keep
      sensitivity_max: internal
  language:
    supported: [en, hi, ta]
    generate_in_target: true
